{% extends 'base.html' %}{% block content %}<p class="eyebrow">Planejamento</p><h1>Concursos</h1><div class="layout"><section class="panel"><h2>Novo concurso</h2><form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><label>Nome<input name="name" required maxlength="140" placeholder="Ex.: Concurso de TI"></label><label>Cargo (opcional)<input name="position" maxlength="140"></label><label>Data da prova<input name="exam_date" type="date" required></label><label>Mínimo geral (pontos)<input name="min_score" type="number" step="any" value="0" required></label><label>Meta pessoal (%)<input name="target_percent" type="number" step="any" min="0" max="100" value="70" required></label><button>Cadastrar concurso</button></form></section><section><h2>Concursos cadastrados</h2>{% for e in exams %}<article class="item"><div><b>{{e.name}}</b><p>{{e.position}} · Prova: {{e.exam_date}}</p></div><a href="{{url_for('exam_detail',exam_id=e.id)}}">Gerenciar</a></article>{% else %}<p class="empty">Nenhum concurso cadastrado.</p>{% endfor %}</section></div>{% endblock %}
