{% extends 'base.html' %}{% block content %}<a class="back" href="{{url_for('exam_detail',exam_id=subj.exam_id)}}">← Voltar ao concurso</a><h1>Editar disciplina</h1><div class="panel narrow"><form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><label>Nome<input name="name" value="{{subj.name}}" required></label><label>Questões<input type="number" name="questions" min="1" value="{{subj.questions}}" required></label><label>Pontos por acerto<input type="number" name="points" step="any" min="0" value="{{subj.points}}" required></label><label>Penalidade por erro<input type="number" name="penalty" step="any" min="0" value="{{subj.penalty}}" required></label><label>Mínimo (pontos)<input type="number" name="min_score" step="any" value="{{subj.min_score}}" required></label><label>Meta (%)<input type="number" name="target_percent" step="any" min="0" max="100" value="{{subj.target_percent}}" required></label><label class="check"><input type="checkbox" name="nonzero" {% if subj.nonzero %}checked{% endif %}> Não zerar</label><button>Salvar</button></form><form method="post" action="{{url_for('delete_subject',subject_id=subj.id)}}" data-confirm="Excluir esta disciplina? Sessões já existentes perderão a referência à disciplina."><input type="hidden" name="csrf" value="{{csrf}}"><button class="danger">Excluir disciplina</button></form></div>{% endblock %}
