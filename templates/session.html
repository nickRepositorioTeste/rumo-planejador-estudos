{% extends 'base.html' %}{% block content %}<a class="back" href="{{url_for('schedule')}}">← Cronograma</a><h1>Editar sessão</h1><section class="panel narrow"><form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><label>Início<input type="datetime-local" name="start_at" value="{{study.start_at}}" required></label><label>Fim<input type="datetime-local" name="end_at" value="{{study.end_at}}" required></label><label>Disciplina<select name="subject_id"><option value="">Sem disciplina</option>{% for s in subjects %}<option value="{{s.id}}" {% if s.id==study.subject_id %}selected{% endif %}>{{s.name}}</option>{% endfor %}</select></label><label>Tipo<select name="kind"><option {% if study.kind=='Estudo' %}selected{% endif %}>Estudo</option><option {% if study.kind=='Questões' %}selected{% endif %}>Questões</option><option {% if study.kind=='Revisão' %}selected{% endif %}>Revisão</option></select></label><label>Minutos realmente estudados<input type="number" name="actual_minutes" min="0" max="1440" value="{{study.actual_minutes}}"></label><label>Observações<textarea name="notes" maxlength="1000">{{study.notes}}</textarea></label><label class="check"><input type="checkbox" name="completed" {% if study.completed %}checked{% endif %}> Marcar como concluída</label><button>Salvar sessão</button></form><form method="post" action="{{url_for('delete_session',session_id=study.id)}}" data-confirm="Excluir esta sessão? Essa ação é permanente."><input type="hidden" name="csrf" value="{{csrf}}"><button class="danger">Excluir sessão</button></form></section>{% endblock %}
