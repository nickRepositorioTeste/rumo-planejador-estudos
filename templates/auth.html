{% extends 'base.html' %}{% block content %}<div class="auth panel"><p class="eyebrow">Seu espaço de estudos</p><h1>{{title}}</h1><p>Organize concursos, horários e simulados em um só lugar.</p><form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><label>E-mail<input type="email" name="email" autocomplete="email" maxlength="200" required></label><label>Senha<input type="password" name="password" minlength="8" autocomplete="{{'new-password' if register else 'current-password'}}" required></label><button type="submit">{{'Criar conta' if register else 'Entrar'}}</button></form><p>{% if register %}Já possui conta? <a href="{{url_for('login')}}">Entrar</a>{% else %}Primeiro acesso? <a href="{{url_for('register')}}">Criar conta</a>{% endif %}</p></div>{% endblock %}
